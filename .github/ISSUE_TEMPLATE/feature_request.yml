name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to make or fix in a photo, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look in `photo.json`, the CLI, the Studio, the MCP server or for an agent (a new filter, look, layer effect, mask type, template, export option…).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
