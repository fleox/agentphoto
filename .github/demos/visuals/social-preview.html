<!doctype html>
<!-- Rendered with: node shot.mjs "file://$PWD/social-preview.html?dir=<folder>" ../../assets/social-preview.png --size 1280x640 --scale 1. Images: the README showcase files (../../assets/showcase-*.jpg, real exports of the published CLI), downsized; ba-* are the before / after composites. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AgentPhoto social preview</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 600; src: url("../../../library/fonts/inter/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("../../../library/fonts/inter/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("../../../library/fonts/inter/inter-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("../../../library/fonts/inter/inter-latin-400-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #0a0b0f; }
  body { font-family: Inter, -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    background: radial-gradient(700px 520px at 0% 0%, rgba(61,107,255,.38), transparent 70%), radial-gradient(600px 400px at 100% 100%, rgba(122,165,255,.12), transparent 70%), #0a0b0f; position: relative; }
  .left { position: absolute; left: 72px; top: 62px; width: 640px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 116px; height: 116px; filter: drop-shadow(0 10px 30px rgba(0,0,0,.5)); }
  .brand b { font-size: 40px; font-weight: 750; letter-spacing: -.02em; }
  .brand b span { color: #7aa5ff; }
  h1 { margin-top: 46px; font-size: 56px; line-height: 1.04; font-weight: 800; letter-spacing: -.035em; }
  h1 .g { background: linear-gradient(90deg, #9dbbff, #5b84ff 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 26px; font-size: 22px; line-height: 1.45; color: #c9cfdb; width: 560px; }
  .chips { margin-top: 30px; display: flex; gap: 12px; }
  .chip { padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); font-size: 18px; font-weight: 600; }
  .stage { position: absolute; left: 690px; top: -60px; width: 800px; height: 800px; perspective: 1400px; }
  .tilt { position: absolute; inset: 0; transform: rotateY(-22deg) rotateX(10deg) rotateZ(-6deg); transform-origin: 0% 50%; display: grid; grid-template-columns: 250px 250px 250px; gap: 16px; padding: 30px 0 0 40px; }
  .card { border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 24px 60px rgba(0,0,0,.6); aspect-ratio: 16/9; background: #111; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .col.b { margin-top: -80px; }
  .col.c { margin-top: -30px; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0b0f 0%, rgba(10,11,15,.0) 14%), linear-gradient(0deg, rgba(10,11,15,.55), transparent 18%), linear-gradient(180deg, rgba(10,11,15,.5), transparent 14%); pointer-events: none; }
</style>
</head>
<body>
  <div class="stage"><div class="tilt" id="tilt"></div><div class="fade"></div></div>
  <div class="left">
    <div class="brand"><img src="../../assets/logo.svg" alt="" /><b>Agent<span>Photo</span></b></div>
    <h1>The photo studio<br /><span class="g">your AI agent can run.</span></h1>
    <p>Retouching, cut-outs, looks, masks and social formats, done by your agent and checked on real renders. Local AI, no server.</p>
    <div class="chips"><span class="chip">Claude Code</span><span class="chip">MCP</span><span class="chip">Hermes</span><span class="chip">Studio</span></div>
  </div>
<script>
  const dir = new URLSearchParams(location.search).get("dir") || "./social";
  const cols = [
    ["youtube-thumbnail", "ba-food", "social-quote", "ba-product", "og-article"],
    ["sale-banner", "ba-city", "polaroid", "product-white", "story-promo"],
    ["avatar-pro", "og-article", "ba-portrait", "youtube-thumbnail", "ba-food"],
  ];
  const tilt = document.getElementById("tilt");
  cols.forEach((ids, i) => {
    const c = document.createElement("div"); c.className = "col " + ["a", "b", "c"][i];
    for (const id of ids) c.insertAdjacentHTML("beforeend", `<div class="card"><img src="${dir}/${id}.jpg" alt=""></div>`);
    tilt.appendChild(c);
  });
</script>
</body>
</html>
